name: release-please

# On every push to main, release-please reads the Conventional Commits since the
# last release and keeps a "Release PR" open with the version bump + CHANGELOG.
# Merging that PR tags the release (vX.Y.Z) and creates the GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
